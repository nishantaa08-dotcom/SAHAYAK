<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SAHAYAK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
    <div class="auth-wrap">
        <a href="index.html" class="auth-back" aria-label="Back to home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to SAHAYAK
        </a>
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGradAuth" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#19B8C7"/>
                                <stop offset="100%" stop-color="#0F9D8A"/>
                            </linearGradient>
                        </defs>
                        <path d="M20 3 L34 8 V20 C34 28 28 34 20 37 C12 34 6 28 6 20 V8 Z" 
                              fill="none" stroke="url(#logoGradAuth)" stroke-width="1.5"/>
                        <path d="M10 26 L16 16 L20 22 L24 14 L30 26 Z" 
                              fill="url(#logoGradAuth)" opacity="0.85"/>
                        <circle cx="24" cy="14" r="2" fill="#19B8C7"/>
                    </svg>
                </div>
                <div class="auth-brand">
                    <span class="brand-name">SAHAYAK</span>
                    <span class="brand-sub">NER Landslide Intelligence</span>
                </div>
            </div>
            <h1 class="auth-title">Sign in to Command Center</h1>
            <p class="auth-subtitle">Access risk intelligence, alerts, and field coordination tools.</p>
            <form class="auth-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Official Email</label>
                    <input type="email" id="email" name="email" placeholder="officer@sahayak.gov.in" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <div class="form-row">
                    <label class="checkbox">
                        <input type="checkbox" name="remember">
                        <span>Remember this device</span>
                    </label>
                    <a href="#" class="auth-link">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                <div class="auth-demo">
                    <span class="demo-indicator"></span>
                    Demo credentials: <code>demo@sahayak.gov.in</code> / <code>demo1234</code>
                </div>
            </form>
            <div class="auth-footer">
                <p>Prototype environment · SIH 2026</p>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
